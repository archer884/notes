[package]
name = "notes"
version = "0.3.0"
edition = "2021"

[dependencies]
abseil = "0.5"
arboard = "3"
clap = { version = "4.5.16", features = ["derive", "wrap_help"] }
crossterm = "0.28"
glob = "0.3"
hyphenation = { version = "0.8.4", features = ["embed_en-us"] }
memory-indexer = "0.3"
owo-colors = "4.0.0"
ratatui = "0.29"
regex = "1.10.6"
serde = { version = "1.0.209", features = ["derive"] }
serde_json = "1.0.127"
textwrap = { version = "0.16.1", features = ["terminal_size"] }
tracing = "0.1.40"
tracing-subscriber = { version = "0.3.18", features = ["env-filter"] }
